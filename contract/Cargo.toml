[package]
name = "docspecialcare"
version = "0.1.0"
edition = "2021"
description = "DocSpecialCare: on-chain care pathway (consult -> referral -> lab -> prescription -> pharmacy) with escrowed payments on NEAR"
repository = "https://github.com/afeezorobsco-cyber/DocSpecialCare"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.13.4-rust-1.85.0"
image_digest = "sha256:a9d8bee7b134856cc8baa142494a177f2ba9ecfededfcdd38f634e14cca8aae2"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5.7"

[dev-dependencies]
near-sdk = { version = "5.7", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
