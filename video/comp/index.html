<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>DocSpecialCare video</title>
<style>
  @font-face { font-family: Geist; src: url("../../web/app/fonts/GeistVF.woff") format("woff"); font-weight: 100 900; }
  @font-face { font-family: GeistMono; src: url("../../web/app/fonts/GeistMonoVF.woff") format("woff"); font-weight: 100 900; }
  :root {
    --ink: #0f172a; --muted: #475569; --line: #e2e8f0; --bg: #f8fafc;
    --teal: #0f766e; --teal-2: #14b8a6; --teal-soft: #ccfbf1; --mint: #00ec97;
    --night: #0b1220; --amber: #f59e0b; --rose: #e11d48;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); font-family: Geist, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(1200px 700px at 70% 0%, #e6fffa 0%, var(--bg) 60%); }
  .scene { position: absolute; inset: 0; visibility: hidden; }
  .dark { background: radial-gradient(1400px 900px at 30% 20%, #13213a 0%, var(--night) 70%); color: #e2e8f0; }
  .center { display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .abs { position: absolute; }
  .mono { font-family: GeistMono, ui-monospace, monospace; }

  /* captions */
  #captions { position: absolute; left: 0; right: 0; bottom: 34px; display: flex; justify-content: center; z-index: 50; pointer-events: none; }
  .cap { position: absolute; bottom: 0; max-width: 1560px; padding: 14px 30px; border-radius: 18px; background: rgba(15, 23, 42, .82); color: #fff; font-size: 38px; line-height: 1.3; font-weight: 500; text-align: center; visibility: hidden; letter-spacing: -.005em; }

  /* browser frame */
  .chip { position: absolute; top: 20px; left: 240px; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-radius: 999px; background: #fff; box-shadow: 0 6px 20px rgba(15,23,42,.08); font-size: 22px; font-weight: 600; border: 1px solid var(--line); }
  .chip .dot { width: 10px; height: 10px; border-radius: 99px; background: var(--teal-2); }
  .steps { position: absolute; top: 20px; right: 240px; display: flex; gap: 8px; }
  .step { height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 999px; font-size: 19px; font-weight: 600; color: #94a3b8; background: #fff; border: 1px solid var(--line); }
  .step.on { color: #fff; background: var(--teal); border-color: var(--teal); }
  .win { position: absolute; left: 240px; top: 80px; width: 1440px; height: 850px; border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 40px 90px rgba(15,23,42,.22), 0 0 0 1px rgba(15,23,42,.08); }
  .bar { height: 40px; background: #f1f5f9; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .bar i { width: 13px; height: 13px; border-radius: 99px; display: block; }
  .url { margin-left: 18px; height: 26px; flex: 1; max-width: 620px; border-radius: 8px; background: #fff; border: 1px solid var(--line); font-size: 15px; color: var(--muted); display: flex; align-items: center; padding: 0 12px; }
  .view { position: relative; width: 1440px; height: 810px; overflow: hidden; }
  .layer { position: absolute; inset: 0; visibility: hidden; }
  .zoom { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; transform-origin: 0 0; }
  .zoom img { width: 1440px; height: 810px; display: block; }
  .hl { position: absolute; border: 4px solid var(--teal-2); border-radius: 14px; box-shadow: 0 0 0 9999px rgba(15,23,42,.18), 0 0 30px rgba(20,184,166,.6); visibility: hidden; }
  .lbl { position: absolute; padding: 10px 18px; border-radius: 12px; background: var(--teal); color: #fff; font-size: 26px; font-weight: 650; white-space: nowrap; box-shadow: 0 10px 30px rgba(15,118,110,.35); visibility: hidden; }
  .cursor { position: absolute; width: 38px; height: 38px; z-index: 5; filter: drop-shadow(0 4px 6px rgba(0,0,0,.25)); }
  .ripple { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 99px; border: 4px solid var(--teal-2); visibility: hidden; }
  .stamp { position: absolute; padding: 14px 28px; border: 6px solid var(--teal); color: var(--teal); border-radius: 16px; font-size: 44px; font-weight: 800; letter-spacing: .04em; background: rgba(255,255,255,.92); visibility: hidden; }

  /* generic motion pieces */
  .h1 { font-size: 84px; font-weight: 750; letter-spacing: -.03em; line-height: 1.05; }
  .h2 { font-size: 56px; font-weight: 700; letter-spacing: -.02em; }
  .sub { font-size: 34px; color: var(--muted); font-weight: 500; }
  .card { background: #fff; border-radius: 26px; box-shadow: 0 20px 60px rgba(15,23,42,.10); border: 1px solid var(--line); }
  .pill { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border-radius: 999px; font-size: 28px; font-weight: 650; }
  .near { background: #111827; color: #fff; }
  .near b { width: 14px; height: 14px; border-radius: 99px; background: var(--mint); display: inline-block; }
  .emoji { font-family: "Apple Color Emoji", "Segoe UI Emoji", sans-serif; }
  .logo { width: 150px; height: 150px; border-radius: 36px; background: var(--teal); color: #fff; display: grid; place-items: center; font-size: 96px; font-weight: 700; box-shadow: 0 30px 60px rgba(15,118,110,.35); }
</style>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
</head>
<body>
<div id="stage"></div>
<div id="captions"></div>
<script>
const D = window.DATA; // { timing, meta, txns }
const stage = document.getElementById("stage");
const caps = document.getElementById("captions");
const master = gsap.timeline({ paused: true });
gsap.defaults({ ease: "power2.out", duration: 0.6 });

const el = (tag, cls, html, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; (parent || stage).appendChild(e); return e; };
const css = (e, o) => (Object.assign(e.style, o), e);

/* ------------------------------------------------------------ captions */
function captions(sc) {
  const parts = sc.text.match(/[^.!?]+[.!?]+(\s|$)/g) || [sc.text];
  // split long sentences on commas to keep two lines max
  const chunks = [];
  for (const p of parts.map((s) => s.trim())) {
    if (p.length <= 95) { chunks.push(p); continue; }
    const bits = p.split(/,\s/); let cur = "";
    for (const b of bits) { const nxt = cur ? cur + ", " + b : b; if (nxt.length > 80 && cur) { chunks.push(cur + ","); cur = b; } else cur = nxt; }
    if (cur) chunks.push(cur);
  }
  const total = chunks.reduce((a, c) => a + c.length + 8, 0);
  let t = sc.speechStart;
  for (const c of chunks) {
    const d = sc.speech * ((c.length + 8) / total);
    const e = el("div", "cap", c, caps);
    master.set(e, { autoAlpha: 1 }, t).set(e, { autoAlpha: 0 }, t + d - 0.02);
    t += d;
  }
}

/* ------------------------------------------------------------ scene shell */
function scene(sc, dark) {
  const root = el("div", "scene" + (dark ? " dark" : ""));
  master.fromTo(root, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.45, ease: "power1.out" }, sc.start);
  master.to(root, { autoAlpha: 0, duration: 0.35, ease: "power1.in" }, sc.start + sc.dur - 0.3);
  return root;
}
const at = (sc, f) => sc.start + sc.dur * f;

/* ------------------------------------------------------------ browser frame + beats */
const PERSONA = {
  landing: "Website", login: "Sign in", "patient-home": "Patient · Amaka", book: "Patient · Amaka", booked: "Patient · Amaka", consult: "Patient · Amaka",
  "gp-chat": "Physician · Dr. Tunde Bello", refer: "Physician · Dr. Tunde Bello", complete: "Physician · Dr. Tunde Bello", "gp-paid": "Physician · Dr. Tunde Bello",
  "referral-card": "Patient · Amaka", order: "Cardiologist · Dr. Ngozi Eze", "pay-lab": "Patient · Amaka", "lab-upload": "Laboratory · CityLab",
  verify: "Cardiologist · Dr. Ngozi Eze", prescribe: "Cardiologist · Dr. Ngozi Eze", "choose-pharmacy": "Patient · Amaka",
  "pharmacy-rx": "Pharmacy · HealthPlus", dispense: "Pharmacy · HealthPlus", "verify-rx": "Pharmacy · HealthPlus",
};
const STEPS = ["Book", "Consult", "Refer", "Test", "Results", "Medicine"];
const K = 1440 / 1600;

function focus(z, b) {
  if (!b || z === 1) return { x: 0, y: 0 };
  const cx = (b.x + b.w / 2) * K, cy = (b.y + b.h / 2) * K;
  const clamp = (v, lo) => Math.min(0, Math.max(lo, v));
  return { x: clamp(720 - z * cx, 1440 - z * 1440), y: clamp(405 - z * cy, 810 - z * 810) };
}

/**
 * beats: [{ shot, from, to, zoom, focusBox, hl:[i], click:i, label:i, stamp }]
 * from/to are fractions of the scene.
 */
function appScene(sc, beats, stepIndex) {
  const root = scene(sc);
  const chips = [];
  const steps = el("div", "steps", "", root);
  STEPS.forEach((s, i) => el("div", "step" + (i === stepIndex ? " on" : ""), `${i + 1} ${s}`, steps));
  const win = el("div", "win", `<div class="bar"><i style="background:#f87171"></i><i style="background:#fbbf24"></i><i style="background:#34d399"></i><div class="url">🔒 docspecialcare.vercel.app/app</div></div>`, root);
  const view = el("div", "view", "", win);
  master.from(win, { y: 40, scale: 0.97, duration: 0.8, ease: "power3.out" }, sc.start);
  master.from(steps, { y: -20, autoAlpha: 0, duration: 0.6 }, sc.start + 0.15);

  const cursor = el("div", "cursor", `<svg viewBox="0 0 24 24" width="38" height="38"><path d="M3 2l7.5 19 2.6-7.6L21 11z" fill="#0f172a" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`, view);
  const ripple = el("div", "ripple", "", view);
  gsap.set(cursor, { x: 1300, y: 760, autoAlpha: 0 });

  beats.forEach((bt, bi) => {
    const m = D.meta.shots[bt.shot];
    const t0 = at(sc, bt.from), t1 = at(sc, bt.to), len = t1 - t0;
    const layer = el("div", "layer", "", view);
    const zoom = el("div", "zoom", `<img src="../shots/${bt.shot}.png">`, layer);
    const chip = el("div", "chip", `<span class="dot"></span><span>${PERSONA[bt.shot] || ""}</span>`, root);
    gsap.set(chip, { autoAlpha: 0 });
    master.set(chip, { autoAlpha: 1 }, t0);
    if (bi < beats.length - 1) master.set(chip, { autoAlpha: 0 }, t1);
    master.fromTo(layer, { autoAlpha: 0 }, { autoAlpha: 1, duration: bi === 0 ? 0.01 : 0.4, ease: "none" }, t0);
    if (bi < beats.length - 1) master.set(layer, { autoAlpha: 0 }, t1 + 0.4);

    const z = bt.zoom || 1;
    const fb = m.boxes[bt.focusBox ?? bt.hl?.[0] ?? 0];
    const f = focus(z, fb);
    if (z !== 1) master.fromTo(zoom, { scale: 1, x: 0, y: 0 }, { scale: z, x: f.x, y: f.y, duration: Math.min(1.4, len * 0.35), ease: "power3.inOut" }, t0 + 0.25);

    const toView = (b) => ({ x: f.x + z * b.x * K, y: f.y + z * b.y * K, w: z * b.w * K, h: z * b.h * K });
    let tHL = t0 + Math.min(1.5, len * 0.4);
    (bt.hl || []).forEach((hi, k) => {
      const b = m.boxes[hi]; if (!b) return;
      const v = toView(b), pad = 10;
      const h = el("div", "hl", "", layer);
      css(h, { left: v.x - pad + "px", top: v.y - pad + "px", width: v.w + 2 * pad + "px", height: v.h + 2 * pad + "px" });
      const lb = el("div", "lbl", b.label, layer);
      const below = v.y + v.h + pad + 70 < 800;
      const lx = Math.max(16, Math.min(1424 - b.label.length * 15 - 40, v.x));
      css(lb, { left: lx + "px", top: (below ? v.y + v.h + pad + 14 : v.y - pad - 66) + "px" });
      const ts = tHL + k * Math.max(0.9, len * 0.18);
      master.fromTo(h, { autoAlpha: 0, scale: 1.08 }, { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, ts);
      master.fromTo(lb, { autoAlpha: 0, y: below ? -8 : 8 }, { autoAlpha: 1, y: 0, duration: 0.45 }, ts + 0.15);
      if (k < bt.hl.length - 1) master.to([h, lb], { autoAlpha: 0, duration: 0.3 }, ts + Math.max(0.9, len * 0.18) - 0.05);

      if (bt.click === hi) {
        const cx = v.x + v.w / 2, cy = v.y + v.h / 2;
        master.set(cursor, { autoAlpha: 1 }, ts - 0.9);
        master.to(cursor, { x: cx, y: cy, duration: 0.85, ease: "power2.inOut" }, ts - 0.9);
        master.fromTo(ripple, { left: cx, top: cy, autoAlpha: 1, scale: 0.3 }, { scale: 1.6, autoAlpha: 0, duration: 0.6, ease: "power1.out" }, ts + 0.5);
        master.to(cursor, { scale: 0.85, duration: 0.12, yoyo: true, repeat: 1 }, ts + 0.45);
      }
    });
    if (bt.stamp) {
      const s = el("div", "stamp", bt.stamp, layer);
      css(s, { right: "90px", top: "120px" });
      master.fromTo(s, { autoAlpha: 0, scale: 2.2, rotation: -14 }, { autoAlpha: 1, scale: 1, rotation: -8, duration: 0.5, ease: "back.out(1.6)" }, t0 + len * 0.55);
    }
    if (bi < beats.length - 1) master.set(cursor, { autoAlpha: 0 }, t1);
  });
}

/* ------------------------------------------------------------ motion scenes */
const PERSON = (c = "#64748b") => `<svg viewBox="0 0 60 120" width="60" height="120"><circle cx="30" cy="20" r="16" fill="${c}"/><path d="M8 118V62c0-14 10-24 22-24s22 10 22 24v56z" fill="${c}"/></svg>`;

const MOTION = {
  queue(sc) {
    const r = scene(sc, true);
    const clock = el("div", "abs", `<svg viewBox="0 0 200 200" width="360" height="360">
      <circle cx="100" cy="100" r="92" fill="#111c31" stroke="#334155" stroke-width="6"/>
      ${Array.from({ length: 12 }, (_, i) => `<line x1="100" y1="16" x2="100" y2="30" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" transform="rotate(${i * 30} 100 100)"/>`).join("")}
      <line id="hh" x1="100" y1="100" x2="100" y2="55" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
      <line id="mh" x1="100" y1="100" x2="100" y2="28" stroke="#14b8a6" stroke-width="5" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="7" fill="#e2e8f0"/></svg>`, r);
    css(clock, { left: "250px", top: "250px" });
    const trow = el("div", "abs", `<span class="mono t" style="font-size:92px;font-weight:600;color:#fff">07:00</span><span style="font-size:40px;color:#94a3b8">AM</span>`, r);
    css(trow, { left: "250px", width: "360px", top: "650px", display: "flex", alignItems: "baseline", justifyContent: "center", gap: "14px" });
    const time = trow.querySelector(".t"), am = trow.lastChild;
    const hh = clock.querySelector("#hh"), mh = clock.querySelector("#mh");
    gsap.set(hh, { rotation: 210, svgOrigin: "100 100" }); gsap.set(mh, { rotation: 0, svgOrigin: "100 100" });
    const q = el("div", "abs", "", r); css(q, { left: "830px", top: "430px", display: "flex", gap: "30px" });
    const people = Array.from({ length: 9 }, (_, i) => el("div", "", PERSON(i === 8 ? "#14b8a6" : "#475569"), q));
    const you = el("div", "abs", "You", r); css(you, { left: "1556px", top: "570px", fontSize: "30px", color: "#5eead4", fontWeight: 700 });
    const door = el("div", "abs", "🏥", r); door.classList.add("emoji"); css(door, { left: "640px", top: "420px", fontSize: "120px", zIndex: 2 });
    const s = sc.start, d = sc.dur;
    master.from(clock, { scale: 0.6, autoAlpha: 0, duration: 0.9, ease: "back.out(1.5)" }, s + 0.1);
    master.from(people, { y: 60, autoAlpha: 0, stagger: 0.06, duration: 0.6 }, s + 0.3);
    master.from([you, door], { autoAlpha: 0, duration: 0.6 }, s + 0.9);
    const p = { m: 0 };
    master.to(p, { m: 285, duration: d - 1.6, ease: "power1.inOut", onUpdate() {
      const mins = 7 * 60 + Math.round(p.m); const h = Math.floor(mins / 60), mm = mins % 60;
      time.textContent = `${String(h).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
      gsap.set(mh, { rotation: (p.m % 60) * 6, svgOrigin: "100 100" }); gsap.set(hh, { rotation: 210 + p.m * 0.5, svgOrigin: "100 100" });
    } }, s + 0.8);
    master.to(q, { x: -90 * 3, duration: d - 1.6, ease: "steps(3)" }, s + 0.8);
    master.to(people.slice(0, 3), { autoAlpha: 0, stagger: (d - 1.6) / 3, duration: 0.3 }, s + 0.8 + (d - 1.6) / 3 - 0.3);
    master.to(you, { x: -270, duration: d - 1.6, ease: "steps(3)" }, s + 0.8);
  },

  problem(sc) {
    const r = scene(sc, true);
    const row = el("div", "abs", "", r); css(row, { left: "160px", top: "250px", display: "flex", gap: "40px" });
    const st = [["👩🏾‍⚕️", "Doctor", "4h 45m"], ["🫀", "Specialist", "3h 10m"], ["🧪", "Laboratory", "2h 20m"], ["💊", "Pharmacy", "1h 30m"]];
    const cards = st.map(([e, n, w]) => {
      const c = el("div", "", `<div class="emoji" style="font-size:84px">${e}</div><div style="font-size:38px;font-weight:700;margin-top:14px">${n}</div><div style="margin-top:14px;font-size:30px;color:#fbbf24" class="mono">⏱ ${w}</div><div style="margin-top:18px;display:flex;gap:8px">${PERSON("#475569").repeat(4).replace(/width="60" height="120"/g, 'width="22" height="44"')}</div>`, row);
      return css(c, { width: "370px", height: "380px", borderRadius: "28px", background: "#111c31", border: "1px solid #24324d", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" });
    });
    const issues = [["📄", "Referrals get lost"], ["🗂️", "Results on paper"], ["💸", "Pay before care"]];
    const iss = el("div", "abs", "", r); css(iss, { left: "160px", top: "700px", display: "flex", gap: "30px" });
    const pills = issues.map(([e, t]) => css(el("div", "pill", `<span class="emoji">${e}</span>${t}<span style="color:#fb7185;margin-left:6px">✕</span>`, iss), { background: "#2a1220", color: "#fecdd3", border: "1px solid #4c1d2e", fontSize: "32px", padding: "16px 28px" }));
    const s = sc.start, d = sc.dur;
    cards.forEach((c, i) => master.from(c, { y: 80, autoAlpha: 0, duration: 0.7, ease: "back.out(1.4)" }, s + 0.2 + i * d * 0.09));
    pills.forEach((p, i) => master.from(p, { scale: 0.6, autoAlpha: 0, duration: 0.5, ease: "back.out(2)" }, s + d * (0.5 + i * 0.13)));
  },

  logo(sc) {
    const r = scene(sc);
    const box = el("div", "abs center", "", r); css(box, { inset: "0" });
    const logo = el("div", "logo", "✚", box);
    const name = el("div", "h1", "DocSpecialCare", box); css(name, { marginTop: "40px", fontSize: "110px" });
    const tag = el("div", "sub", "See a doctor, a specialist, a lab and a pharmacy, without the queue.", box); css(tag, { marginTop: "22px", fontSize: "38px" });
    const badges = el("div", "", "", box); css(badges, { marginTop: "48px", display: "flex", gap: "18px" });
    ["🩺 Online consultations", "📨 Referrals", "🧪 Lab results", "💊 Prescriptions"].forEach((b) => css(el("div", "pill", b, badges), { background: "#fff", border: "1px solid #e2e8f0", fontSize: "28px" }));
    const s = sc.start;
    master.from(logo, { scale: 0, rotation: -30, duration: 0.9, ease: "back.out(1.8)" }, s + 0.15);
    master.from(name, { y: 40, autoAlpha: 0, duration: 0.7 }, s + 0.6);
    master.from(tag, { y: 30, autoAlpha: 0, duration: 0.7 }, s + 1.0);
    master.from(badges.children, { y: 30, autoAlpha: 0, stagger: 0.18, duration: 0.5, ease: "back.out(2)" }, s + 1.6);
  },

  referee(sc) {
    const r = scene(sc);
    const W = 1920, cx = 640, cy = 520, R = 300;
    const nodes = [["👩🏾", "Patient"], ["👨🏾‍⚕️", "Doctor"], ["🫀", "Specialist"], ["🧪", "Laboratory"], ["💊", "Pharmacy"]];
    const svg = el("div", "abs", `<svg width="${W}" height="1080">${nodes.map((_, i) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5; return `<line class="ln" x1="${cx}" y1="${cy}" x2="${cx + R * Math.cos(a)}" y2="${cy + R * Math.sin(a)}" stroke="#14b8a6" stroke-width="4" stroke-dasharray="10 10" />`; }).join("")}</svg>`, r);
    css(svg, { left: 0, top: 0 });
    const hub = el("div", "abs center", `<div style="font-size:54px;font-weight:800;letter-spacing:.02em">NEAR</div><div style="font-size:24px;color:#a7f3d0;margin-top:6px">digital referee</div>`, r);
    css(hub, { left: cx - 120 + "px", top: cy - 120 + "px", width: "240px", height: "240px", borderRadius: "999px", background: "#111827", color: "#fff", boxShadow: "0 0 0 10px rgba(0,236,151,.25), 0 30px 60px rgba(0,0,0,.25)" });
    const ns = nodes.map(([e, n], i) => {
      const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5;
      const d = el("div", "abs center card", `<div class="emoji" style="font-size:64px">${e}</div><div style="font-size:26px;font-weight:700;margin-top:6px">${n}</div>`, r);
      return css(d, { left: cx + R * Math.cos(a) - 95 + "px", top: cy + R * Math.sin(a) - 85 + "px", width: "190px", height: "170px" });
    });
    const col = el("div", "abs", "", r); css(col, { left: "1120px", top: "230px", width: "680px", display: "flex", flexDirection: "column", gap: "28px" });
    const pillars = [["🔐", "Holds your payment safely", "Released only when care is delivered"], ["📜", "Records every step", "Referrals and prescriptions can't be lost or faked"], ["🗝️", "You choose who sees your data", "Medical records stay locked and private"]];
